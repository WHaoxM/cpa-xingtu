name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS: GitHub Actions deprecated Node 20 runtime; Vite 7 requires >=22.12
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (mock / offline demo)
        env:
          # 静态 Pages 不接后端；强制 fixture 模式，避免默认 http 打空接口
          VITE_API_MODE: mock
          VITE_APP_TITLE: 职导星图
          VITE_PLATFORM_ORIGIN: ${{ vars.CPA_PLATFORM_ORIGIN }}
        run: npm run build-only

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 容忍 Pages 构建队列排队（偶发 deployment_queued 数分钟），避免过早超时取消
          timeout: 1200000
