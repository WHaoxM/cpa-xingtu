name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS: GitHub Actions deprecated Node 20 runtime; Vite 7 requires >=22.12
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate configured backend origin
        if: ${{ vars.CPA_BACKEND_API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ vars.CPA_BACKEND_API_BASE_URL }}
        run: |
          node <<'NODE'
          const value = process.env.API_BASE_URL;
          let url;
          try { url = new URL(value); } catch { throw new Error('CPA_BACKEND_API_BASE_URL must be an absolute HTTPS URL'); }
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
            throw new Error('CPA_BACKEND_API_BASE_URL must use HTTPS and must not contain credentials, query, or fragment');
          }
          NODE

      - name: Build (backend when configured, otherwise mock demo)
        env:
          # 未配置外部后端时保持离线演示；仅用公开的 API origin 切换为 HTTP。
          VITE_API_MODE: ${{ vars.CPA_BACKEND_API_BASE_URL != '' && 'http' || 'mock' }}
          VITE_API_BASE_URL: ${{ vars.CPA_BACKEND_API_BASE_URL }}
          VITE_APP_TITLE: 职导星图
          VITE_PLATFORM_ORIGIN: ${{ vars.CPA_PLATFORM_ORIGIN }}
        run: npm run build-only

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 容忍 Pages 构建队列排队（偶发 deployment_queued 数分钟），避免过早超时取消
          timeout: 1200000
