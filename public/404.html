<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPA Xingtu</title>
  <script>
    // GitHub Pages serves this file for routes that are not physical files.
    // Legacy printed links go to the marketing page; QEdge app-host routes
    // return to `/` with their original path so Vue Router can restore them.
    (function () {
      const location = window.location;
      const path = location.pathname;
      const isLegacyPagesHost = location.hostname.toLowerCase() === 'whaoxm.github.io';
      const isLegacyProjectPath = path === '/cpa-xingtu' || path.startsWith('/cpa-xingtu/');
      if (isLegacyPagesHost && isLegacyProjectPath) {
        location.replace('https://www.xingtulabs.top/');
        return;
      }

      const route = path + location.search + location.hash;
      const destination = new URL('/', location.origin);
      destination.searchParams.set('__spa_redirect', route);
      location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <h1>正在跳转…</h1>
  <p>如果页面没有自动跳转，请<a href="https://www.xingtulabs.top/">打开职导星图官网</a>。</p>
</body>
</html>
