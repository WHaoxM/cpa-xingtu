<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/AstroLogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=LXGW+WenKai:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@300;400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Vite App</title>
    <script>
      // Restore a GitHub Pages deep link before the module initializes Vue Router.
      (function () {
        const base = '/cpa-xingtu/';
        if (window.location.pathname !== base) return;
        const route = new URL(window.location.href).searchParams.get('__spa_redirect');
        if (!route) return;
        const target = new URL(route, window.location.origin + base);
        if (target.origin !== window.location.origin || !target.pathname.startsWith(base)) return;
        window.history.replaceState(null, '', target.pathname + target.search + target.hash);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
