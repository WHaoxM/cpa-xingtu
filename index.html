<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/AstroLogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f3ee">
    <meta name="description" content="职导星图为大学生提供职业探索、能力评估、课程学习与职业发展规划。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="职导星图">
    <meta property="og:title" content="职导星图｜职业发展平台">
    <meta property="og:description" content="探索适合自己的职业方向，从每一次学习与积累，走向更广阔的未来。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Web fonts enhance the existing design, but must not hold the HTML
         parser, route bootstrap or login form behind an external service. -->
    <link id="app-web-fonts" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=LXGW+WenKai:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Noto+Serif+SC:wght@300;400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" media="print">
    <title>职导星图｜职业发展平台</title>
    <script>
      // Keep printed legacy links useful: send the old project URL to the
      // product landing page. Custom accelerator hostnames continue into the
      // same Vue application without hostname-specific login routing.
      (function () {
        const location = window.location;
        const path = location.pathname;
        const isLegacyPagesHost = location.hostname.toLowerCase() === 'whaoxm.github.io';
        const isLegacyProjectPath = path === '/cpa-xingtu' || path.startsWith('/cpa-xingtu/');
        if (isLegacyPagesHost && isLegacyProjectPath) {
          location.replace('https://www.xingtulabs.top/');
          return;
        }

        // Restore a deep link after the static-host 404 fallback sent it to `/`.
        const source = new URL(location.href);
        if (source.pathname !== '/') return;
        const route = source.searchParams.get('__spa_redirect');
        if (route && route.startsWith('/') && !route.startsWith('//')) {
          const target = new URL(route, source.origin);
          if (target.origin === source.origin) {
            window.history.replaceState(null, '', target.pathname + target.search + target.hash);
          }
        }
      })();
    </script>
    <script>
      (function () {
        const stylesheet = document.getElementById('app-web-fonts');
        if (stylesheet) {
          stylesheet.addEventListener('load', function () {
            stylesheet.media = 'all';
          }, { once: true });
        }
        // Failure leaves the existing system-font fallbacks active. No reload,
        // timer, or dependency on font completion is part of application boot.
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
